<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I'm Sorry ❤️</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  height: 100vh;
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
  font-family: Arial, sans-serif;
  background: linear-gradient(135deg, #ffd6e0, #fff0f3);
}

.card {
  z-index: 2;
  background: rgba(255,255,255,0.75);
  padding: 45px 35px;
  border-radius: 30px;
  box-shadow: 0 15px 40px rgba(0,0,0,0.12);
  animation: appear 1.2s ease;
}

.sorry {
  font-size: 65px;
  color: #ff477e;
  animation: heartbeat 1.3s infinite;
}

h2 {
  margin-top: 15px;
  color: #444;
}

p {
  margin-top: 12px;
  color: #777;
  line-height: 1.6;
}

button {
  margin-top: 25px;
  border: none;
  padding: 13px 25px;
  border-radius: 30px;
  background: #ff477e;
  color: white;
  font-size: 17px;
  cursor: pointer;
  transition: .3s;
}

button:hover {
  transform: scale(1.08);
}

.heart {
  position: absolute;
  bottom: -50px;
  color: #ff477e;
  animation: floatUp linear forwards;
}

@keyframes heartbeat {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

@keyframes appear {
  from {
    opacity: 0;
    transform: translateY(40px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

@keyframes floatUp {
  to {
    transform: translateY(-110vh) rotate(360deg);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="card">
  <div class="sorry">SORRY ❤️</div>

  <h2>I really didn't mean to hurt you.</h2>

  <p>
    I know a simple sorry can't fix everything,<br>
    but you mean too much to me to let this stay unfixed. 🥺
  </p>

  <button onclick="forgive()">Tap if you forgive me 💗</button>
</div>

<script>
function createHeart() {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤";

  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (15 + Math.random() * 30) + "px";
  heart.style.animationDuration = (3 + Math.random() * 4) + "s";

  document.body.appendChild(heart);

  setTimeout(() => heart.remove(), 7000);
}

setInterval(createHeart, 300);

function forgive() {
  document.querySelector(".card").innerHTML = `
    <div class="sorry">YAY! ❤️</div>
    <h2>Thank you for forgiving me 🥹</h2>
    <p>I promise to make that smile worth protecting. 💕</p>
  `;

  for(let i = 0; i < 40; i++) {
    setTimeout(createHeart, i * 50);
  }
}
</script>

</body>
</html>
